<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4;
            margin: 2cm 2.5cm;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #1c1917;
        }

        h1 {
            font-size: 22pt;
            margin-bottom: 4pt;
            color: #0f766e;
        }

        .pdf-meta {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #78716c;
            margin-bottom: 18pt;
            padding-bottom: 8pt;
            border-bottom: 0.5pt solid #e7e5e4;
        }

        h2 {
            font-size: 15pt;
            margin-top: 18pt;
            margin-bottom: 8pt;
            padding-bottom: 3pt;
            border-bottom: 0.5pt solid #e7e5e4;
        }

        h3 {
            font-size: 12pt;
            margin-top: 14pt;
            margin-bottom: 6pt;
        }

        p {
            margin-bottom: 8pt;
            text-align: justify;
        }

        strong { font-weight: bold; }
        em { font-style: italic; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10pt 0;
            font-size: 10pt;
        }

        th, td {
            border: 0.5pt solid #d6d3d1;
            padding: 5pt 8pt;
            text-align: left;
        }

        th {
            background-color: #f5f5f4;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5pt;
        }

        ul, ol {
            margin-bottom: 8pt;
            padding-left: 20pt;
        }

        li { margin-bottom: 3pt; }

        blockquote {
            border-left: 2pt solid #0f766e;
            padding: 4pt 10pt;
            margin: 10pt 0;
            color: #57534e;
            font-style: italic;
        }

        img { max-width: 100%; height: auto; }

        h1, h2, h3 { page-break-after: avoid; }
        table { page-break-inside: avoid; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    {% if meta.get('type') %}
    <div class="pdf-meta">
        {{ meta.get('type', '') }}
        {% if meta.get('created') %} &middot; {{ meta.get('created') }}{% endif %}
    </div>
    {% endif %}
    {{ content | safe }}
</body>
</html>
